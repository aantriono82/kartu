name: Build installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # Uji otomatis (import Excel, PDF/PNG 4 template, backup/restore) — installer hanya dibuat jika lulus
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Pasang font sistem untuk Chromium
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb fonts-dejavu-core
      - run: xvfb-run -a npm test

  build:
    # push biasa ke main / PR cukup diuji; installer dibuat untuk tag v* atau dijalankan manual
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v7
        with:
          name: kartu-ujian-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb

  release:
    # Buat GitHub Release (sidebar "Releases") saat push tag v*, mis. v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kartu Ujian $TAG" \
            --notes "Installer Kartu Ujian $TAG

          - **Windows 10/11:** unduh \`KartuUjian-Setup-*.exe\`, jalankan. Jika muncul peringatan SmartScreen, klik *More info → Run anyway*.
          - **Linux Mint / Ubuntu (disarankan):** unduh \`KartuUjian-*-amd64.deb\`, klik dua kali → *Install Package*. Aplikasi muncul di Menu → Kantor → Kartu Ujian. Untuk update, pasang .deb versi baru dengan cara yang sama.
          - **Linux lain:** unduh \`KartuUjian-*.AppImage\`, beri izin eksekusi (\`chmod +x\`), lalu jalankan."
