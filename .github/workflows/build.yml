name: Build installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: kartu-ujian-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage

  release:
    # Buat GitHub Release (sidebar "Releases") saat push tag v*, mis. v1.0.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kartu Ujian $TAG" \
            --notes "Installer Kartu Ujian $TAG

          - **Windows 10/11:** unduh \`KartuUjian-Setup-*.exe\`, jalankan. Jika muncul peringatan SmartScreen, klik *More info → Run anyway*.
          - **Linux:** unduh \`KartuUjian-*.AppImage\`, beri izin eksekusi (\`chmod +x\`), lalu jalankan."
